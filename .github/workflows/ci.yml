name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate lesson content
        run: python3 tools/validate_content.py
      - run: python3 tools/check_progression.py

      # The Android folder is generated by Flutter itself. Until it is committed,
      # create it here, restore every tracked file so nothing of ours is overwritten,
      # and drop the sample test that belongs to Flutter's template app.
      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name movira --org app.movira .
            git checkout -- .
            rm -f test/widget_test.dart
          fi

      - name: Patch Android manifest
        run: python3 tools/patch_android.py

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Test builds are signed with the same test key every time, so a new
      # build installs over the previous one. Never used for release builds.
      - run: mkdir -p ~/.android && cp tools/debug.keystore ~/.android/debug.keystore
      - run: flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: movira-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
