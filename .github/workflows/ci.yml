name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate lesson content
        run: python3 tools/validate_content.py

      # The Android folder is generated by Flutter itself. Until it is committed,
      # create it here and restore every tracked file so nothing of ours is overwritten.
      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name movira --org app.movira .
            git checkout -- .
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: movira-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
